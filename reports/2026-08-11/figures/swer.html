 y2="444" stroke="#c3c2b7" stroke-width="1"/><text x="0" y="488" class="figcap">Speaker-attributed word error rate. Reference and predicted speaker streams are matched by a</text><text x="0" y="502" class="figcap">Hungarian assignment on their time-overlap matrix, WER is computed within each reference stream,</text><text x="0" y="516" class="figcap">and the per-stream scores are averaged. Each stream is capped at 1.0 and reference streams under</text><text x="0" y="530" class="figcap">five words are discarded as transcript formatting artifacts. Both corrections matter: uncapped,</text><text x="0" y="544" class="figcap">a stray one-word speaker line in a human transcript matched against a large predicted stream</text><text x="0" y="558" class="figcap">scored 88.0 on a single visit and moved a system's corpus average by 32 points, so the metric</text><text x="0" y="572" class="figcap">was ranking systems by how many streams they emitted rather than by where they put the words.</text><line x1="0" y1="584" x2="602" y2="584" stroke="#e1e0d9" stroke-width="1"/><circle cx="5" cy="596" r="5" fill="#5a5a56"/><text x="15" y="600" class="leg">median visit</text><circle cx="98" cy="596" r="4.5" fill="#ffffff" stroke="#3a3a37" stroke-width="1.6"/><text x="108" y="600" class="leg">mean (value shown)</text><line x1="228" y1="596" x2="252" y2="596" stroke="#5a5a56" stroke-width="4" opacity="0.4" stroke-linecap="round"/><text x="258" y="600" class="leg">middle 50% of visits</text><circle cx="382" cy="596" r="4" fill="#1baf7a"/><text x="392" y="600" class="leg">best</text></svg></g></svg>
