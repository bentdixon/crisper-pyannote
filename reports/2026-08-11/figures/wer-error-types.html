ber as noise</text><rect x="0.0" y="364" width="10" height="10" rx="2" fill="#2a78d6"/><text x="16.0" y="373" class="leg">discourse marker &#8212; like, so, just, well, you know</text><rect x="0.0" y="381" width="10" height="10" rx="2" fill="#1c4f8f"/><text x="16.0" y="390" class="leg">other insertion &#8212; speech present in the audio and absent from the transcript</text></svg></g><text x="0" y="482" class="figcap">Filled pauses are removed from both sides before scoring, so um and uh contribute nothing here,</text><text x="0" y="496" class="figcap">and scoring is restricted to the span each human transcript covers -- they stop early on a third</text><text x="0" y="510" class="figcap">of this cohort, most of those at a hard 32-minute cutoff, and including the remainder inflated</text><text x="0" y="524" class="figcap">WER from roughly 12% to roughly 42%. Warm segments are transcription error: words heard wrong or</text><text x="0" y="538" class="figcap">missed. Cool segments are speech the machine produced that the transcript does not record, a</text><text x="0" y="552" class="figcap">convention difference rather than a failure.</text></svg></g></svg>
