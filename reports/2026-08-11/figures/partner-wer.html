xt><line x1="250" y1="84" x2="250" y2="444" stroke="#c3c2b7" stroke-width="1"/><text x="0" y="488" class="figcap">The partner team's compareFiles.py, vendored unmodified and run over the same 269 visits and the</text><text x="0" y="502" class="figcap">same system outputs. Their algorithm is not ours: alignment is difflib's SequenceMatcher rather</text><text x="0" y="516" class="figcap">than a minimum edit distance, so a replace block costs the longer of its two sides and the</text><text x="0" y="530" class="figcap">result is an upper bound on WER; and filled pauses are collapsed to a single token on both sides</text><text x="0" y="544" class="figcap">rather than deleted. It agrees with our ranking from independent code, which is what makes it</text><text x="0" y="558" class="figcap">worth showing. Note the unusually wide gap between the median dot and the mean marker: a tail of</text><text x="0" y="572" class="figcap">visits whose human transcript covers only part of the session scores above 100% and carries</text><text x="0" y="586" class="figcap">every mean on this chart.</text><line x1="0" y1="598" x2="602" y2="598" stroke="#e1e0d9" stroke-width="1"/><circle cx="5" cy="610" r="5" fill="#5a5a56"/><text x="15" y="614" class="leg">median visit</text><circle cx="98" cy="610" r="4.5" fill="#ffffff" stroke="#3a3a37" stroke-width="1.6"/><text x="108" y="614" class="leg">mean (value shown)</text><line x1="228" y1="610" x2="252" y2="610" stroke="#5a5a56" stroke-width="4" opacity="0.4" stroke-linecap="round"/><text x="258" y="614" class="leg">middle 50% of visits</text><circle cx="382" cy="610" r="4" fill="#1baf7a"/><text x="392" y="614" class="leg">best</text></svg></g></svg>
