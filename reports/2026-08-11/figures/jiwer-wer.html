2="250" y2="444" stroke="#c3c2b7" stroke-width="1"/><text x="0" y="488" class="figcap">A third WER implementation, supplied by the study team and vendored unmodified: jiwer's edit</text><text x="0" y="502" class="figcap">distance after everything inside square brackets is deleted, all punctuation is stripped and</text><text x="0" y="516" class="figcap">both sides are lowercased. It is the standard minimum-edit-distance WER, so it reads below the</text><text x="0" y="530" class="figcap">partner team's difflib upper bound and close to ours, over the same covered spans and the same</text><text x="0" y="544" class="figcap">outputs. One asymmetry to know about: deleting bracketed content removes every CrisperWhisper</text><text x="0" y="558" class="figcap">filled pause, written [UM] and [UH], while Chirp-3's plain "um" survives, so the CrisperWhisper</text><text x="0" y="572" class="figcap">arms are charged deletions their transcripts did not earn. Removing filled pauses from both</text><text x="0" y="586" class="figcap">sides for every system widens their lead rather than narrowing it.</text><line x1="0" y1="598" x2="602" y2="598" stroke="#e1e0d9" stroke-width="1"/><circle cx="5" cy="610" r="5" fill="#5a5a56"/><text x="15" y="614" class="leg">median visit</text><circle cx="98" cy="610" r="4.5" fill="#ffffff" stroke="#3a3a37" stroke-width="1.6"/><text x="108" y="614" class="leg">mean (value shown)</text><line x1="228" y1="610" x2="252" y2="610" stroke="#5a5a56" stroke-width="4" opacity="0.4" stroke-linecap="round"/><text x="258" y="614" class="leg">middle 50% of visits</text><circle cx="382" cy="610" r="4" fill="#1baf7a"/><text x="392" y="614" class="leg">best</text></svg></g></svg>
