t="38.0" fill="#b3382c"/><rect x="459.5" y="83.0" width="95.2" height="38.0" fill="#7a4fa3"/><text x="698" y="106.0" class="val">27.1% of 68950 turns</text><text x="256" y="159.0" text-anchor="end" class="cat">CrisperWhisper 2.0 ASR +</text><text x="256" y="173.0" text-anchor="end" class="cat">pyannote community-1</text><rect x="270.0" y="143.0" width="262.6" height="38.0" fill="#b3382c"/><rect x="532.6" y="143.0" width="53.1" height="38.0" fill="#7a4fa3"/><text x="698" y="166.0" class="val">30.1% of 68950 turns</text><text x="256" y="212.0" text-anchor="end" class="cat">CrisperWhisper 2.0 ASR +</text><text x="256" y="226.0" text-anchor="end" class="cat">pyannote community-1 (diarize-first</text><text x="256" y="240.0" text-anchor="end" class="cat">windows)</text><rect x="270.0" y="203.0" width="193.3" height="38.0" fill="#b3382c"/><rect x="463.3" y="203.0" width="38.5" height="38.0" fill="#7a4fa3"/><text x="698" y="226.0" class="val">22.1% of 68950 turns</text><text x="256" y="279.0" text-anchor="end" class="cat">CrisperWhisper 2.0 ASR +</text><text x="256" y="293.0" text-anchor="end" class="cat">pyannote 3.1</text><rect x="270.0" y="263.0" width="187.7" height="38.0" fill="#b3382c"/><rect x="457.7" y="263.0" width="50.4" height="38.0" fill="#7a4fa3"/><text x="698" y="286.0" class="val">22.7% of 68950 turns</text><text x="480.0" y="338" text-anchor="middle" class="tick">share of all scored turns</text><g transform="translate(2,352)"><rect x="0.0" y="-9" width="10" height="10" rx="2" fill="#b3382c"/><text x="16.0" y="0" class="leg">words never transcribed</text><rect x="0.0" y="8" width="10" height="10" rx="2" fill="#7a4fa3"/><text x="16.0" y="17" class="leg">credited to the wrong person</text></g></svg></g><text x="0" y="461" class="figcap">Every turn the typists recorded, by what the system did with it. Two outcomes that cannot both</text><text x="0" y="475" class="figcap">apply: the turn's words are nowhere in the transcript, or they are there under the wrong</text><text x="0" y="489" class="figcap">speaker. Missing words dominate misfiled ones for every system. Our pipeline misfiles the least,</text><text x="0" y="503" class="figcap">5.1% against Chirp-3's 8.7%, and loses the most, 25.0% against 17.6% -- the loss being short</text><text x="0" y="517" class="figcap">answers it never transcribed. An earlier version of this figure split the bar three ways on a</text><text x="0" y="531" class="figcap">measure that asked only whether anything was transcribed nearby, which the neighbouring speaker</text><text x="0" y="545" class="figcap">satisfies, and so overstated misattribution several times over.</text></svg></g></svg>
