" y2="444" stroke="#c3c2b7" stroke-width="1"/><text x="0" y="488" class="figcap">Substitutions plus deletions plus insertions, divided by the number of reference words, after</text><text x="0" y="502" class="figcap">filled pauses are removed from both sides. WER is not capped at 100%: a system that inserts more</text><text x="0" y="516" class="figcap">words than the reference contains scores above it. Scoring is restricted to the span each human</text><text x="0" y="530" class="figcap">transcript actually covers -- they stop early on a third of this cohort, and including the</text><text x="0" y="544" class="figcap">untranscribed remainder charged every system for minutes the reference never described,</text><text x="0" y="558" class="figcap">inflating WER from roughly 12% to roughly 42%. Within the covered span the machine now emits</text><text x="0" y="572" class="figcap">slightly fewer words than the reference, and deletions rather than insertions carry most of the</text><text x="0" y="586" class="figcap">total.</text><line x1="0" y1="598" x2="602" y2="598" stroke="#e1e0d9" stroke-width="1"/><circle cx="5" cy="610" r="5" fill="#5a5a56"/><text x="15" y="614" class="leg">median visit</text><circle cx="98" cy="610" r="4.5" fill="#ffffff" stroke="#3a3a37" stroke-width="1.6"/><text x="108" y="614" class="leg">mean (value shown)</text><line x1="228" y1="610" x2="252" y2="610" stroke="#5a5a56" stroke-width="4" opacity="0.4" stroke-linecap="round"/><text x="258" y="614" class="leg">middle 50% of visits</text><circle cx="382" cy="610" r="4" fill="#1baf7a"/><text x="392" y="614" class="leg">best</text></svg></g></svg>
