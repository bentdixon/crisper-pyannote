[project]
name = "crisper-whisper-2"
version = "0.1.0"
description = "Verbatim, word-level, speaker-attributed transcription: CrisperWhisper 2.0 + pyannote speaker-diarization-community-1"
requires-python = ">=3.10,<3.13"
dependencies = [
    # ct2 backend (CTranslate2 fork + CUDA libs) ships Linux-only wheels;
    # macOS gets the base package so local development still imports.
    # The transformers extra is required on Linux too: the one-time
    # HF -> CTranslate2 model conversion imports transformers.
    "crisperwhisper[ct2,transformers]; sys_platform == 'linux'",
    "crisperwhisper; sys_platform != 'linux'",
    "pyannote-audio>=4.0",
    "torch",
    "torchaudio",
    # CUDA 13 runtime libs required by the PyPI torchcodec wheel (used by
    # pyannote's training dataloader); preloaded by finetune/torchcodec_preload.py.
    "nvidia-cuda-nvrtc; sys_platform == 'linux'",
    "nvidia-cuda-runtime; sys_platform == 'linux'",
    "pydub>=0.25.1",
    "silero-vad>=6.2.1",
]

[project.scripts]
transcribe-session = "crisper_pipeline.cli:main"
verbatimize-session = "crisper_pipeline.verbatimize_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crisper_pipeline"]

# CUDA wheels on the Linux cluster; default PyPI wheels (CPU/MPS) for local
# development on macOS.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]
torchaudio = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]
